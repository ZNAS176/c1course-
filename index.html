  intriguing . I couldn’t put the book down.", "translation": "intrigante", "sheet": "C1.1"}, {"file": "File 4", "section": "Describing books and films", "word": "moving", "partOfSpeech": "adj", "pronunciation": "/ˈmuːvɪŋ/", "example": "The film was so  moving  it brought tears to my eyes.", "translation": "emotivo", "sheet": "C1.1"}, {"file": "File 4", "section": "Describing books and films", "word": "thought-provoking", "partOfSpeech": "adj", "pronunciation": "/ˈθɔːt prəˈvəʊkɪŋ/", "example": "It’s a  thought-provoking  essay. It raises many interesting questions.", "translation": "que hace reflexionar", "sheet": "C1.1"}, {"file": "File 5", "section": "V.B.Expressions with time", "word": "a matter of time", "partOfSpeech": "phr", "pronunciation": "/ə ˈmætər əv taɪm/", "example": "I’m sure you’ll find a job. It’s just  a matter of time .", "translation": "una cuestión de tiempo", "sheet": "C1.1"}, {"file": "File 5", "section": "V.B.Expressions with time", "word": "any time from", "partOfSpeech": "phr", "pronunciation": "/ˈeni taɪm frəm/", "example": "You can come  any time from  10 a.m. to 2 p.m .", "translation": "en cualquier momento", "sheet": "C1.1"}, {"file": "File 5", "section": "V.B.Expressions with time", "word": "at the time", "partOfSpeech": "phr", "pronunciation": "/ət ðə taɪm/", "example": "I missed the birth of my first child. I was on a plane  at the time .", "translation": "en aquel momento", "sheet": "C1.1"}, {"file": "File 5", "section": "V.B.Expressions with time", "word": "at times", "partOfSpeech": "phr", "pronunciation": "/ət taɪmz/", "example": "She can be bad-tempered  at times .", "translation": "a veces", "sheet": "C1.1"}, {"file": "File 5", "section": "V.B.Expressions with time", "word": "before my time", "partOfSpeech": "phr", "pronunciation": "/bɪˈfɔː maɪ taɪm/", "example": "I’ve never heard of that singer. She must have been  before my time .", "translation": "anterior a mi época", "sheet": "C1.1"}, {"file": "File 5", "section": "V.B.Expressions with time", "word": "behind the times", "partOfSpeech": "phr", "pronunciation": "/bɪˈhaɪnd ðə taɪmz/", "example": "He’s a bit  behind the times . He still thinks men should wear a suit at work.", "translation": "chapado a la antigua", "sheet": "C1.1"}, {"file": "File 5", "section": "V.B.Expressions with time", "word": "by the time", "partOfSpeech": "phr", "pronunciation": "/baɪ ðə taɪm/", "example": "By the time  we got to the station, the train had left.", "translation": "cuando", "sheet": "C1.1"}, {"file": "File 5", "section": "V.B.Expressions with time", "word": "for the time being", "partOfSpeech": "phr", "pronunciation": "/fə ðə taɪm ˈbiːɪŋ/", "example": "You can stay here  for the time being .", "translation": "de momento", "sheet": "C1.1"}, {"file": "File 5", "section": "V.B.Expressions with time", "word": "from time to time", "partOfSpeech": "phr", "pronunciation": "/frəm taɪm tə taɪm/", "example": "I eat out at restaurants  from time to time .", "translation": "de vez en cuando", "sheet": "C1.1"}, {"file": "File 5", "section": "V.B.Expressions with time", "word": "give (someone) a hard time", "partOfSpeech": "phr", "pronunciation": "/gɪv ˈsʌmwʌn ə hɑːd taɪm/", "example": "If I’m late again, Dad will  give me a hard time .", "translation": "regañar", "sheet": "C1.1"}, {"file": "File 5", "section": "V.B.Expressions with time", "word": "have the time of your life", "partOfSpeech": "phr", "pronunciation": "/hæv ðə taɪm əv jɔː laɪf/", "example": "New York is such a fantastic city. You are going to  have the time of your life .", "translation": "pasárselo de maravilla", "sheet": "C1.1"}, {"file": "File 5", "section": "V.B.Expressions with time", "word": "in no time", "partOfSpeech": "phr", "pronunciation": "/ɪn nəʊ taɪm/", "example": "I thought it would take me ages, but in fact I finished it  in no time .", "translation": "en nada", "sheet": "C1.1"}, {"file": "File 5", "section": "V.B.Expressions with time", "word": "in time for", "partOfSpeech": "phr", "pronunciation": "/ɪn taɪm fə/", "example": "We arrived  in time for  his speech.", "translation": "a tiempo para", "sheet": "C1.1"}, {"file": "File 5", "section": "V.B.Expressions with time", "word": "it’s about time", "partOfSpeech": "phr", "pronunciation": "/ɪts əˈbaʊt taɪm/", "example": "You’ve had that computer for ages.  It’s about time  you got a new one.", "translation": "ya es hora de", "sheet": "C1.1"}, {"file": "File 5", "section": "V.B.Expressions with time", "word": "kill time", "partOfSpeech": "phr", "pronunciation": "/kɪl taɪm/", "example": "I do crosswords to  kill time  while I wait at the airport.", "translation": "matar el tiempo", "sheet": "C1.1"}, {"file": "File 5", "section": "V.B.Expressions with time", "word": "make up for lost time", "partOfSpeech": "phr", "pronunciation": "/meɪk ʌp fə lɒst taɪm/", "example": "I’ll have to work hard now to  make up for lost time .", "translation": "recuperar el tiempo perdido", "sheet": "C1.1"}, {"file": "File 5", "section": "V.B.Expressions with time", "word": "me time", "partOfSpeech": "phr", "pronunciation": "/ˈmiː taim/", "example": "I go shopping when I want some  me time .", "translation": "tiempo para mí", "sheet": "C1.1"}, {"file": "File 5", "section": "V.B.Expressions with time", "word": "one thing at a time", "partOfSpeech": "phr", "pronunciation": "/wʌn θɪŋ ət ə taɪm/", "example": "Don't try to multitask. Just do  one thing at a time .", "translation": "una cosa a la vez", "sheet": "C1.1"}, {"file": "File 5", "section": "V.B.Expressions with time", "word": "on time", "partOfSpeech": "adv", "pronunciation": "/ɒn taɪm/", "example": "We expect staff to be  on time  every morning.", "translation": "puntual", "sheet": "C1.1"}, {"file": "File 5", "section": "V.B.Expressions with time", "word": "run out of time", "partOfSpeech": "phr", "pronunciation": "/rʌn aʊt əv taɪm/", "example": "If we take too long at the museum, we’ll  run out of time .", "translation": "quedarse sin tiempo", "sheet": "C1.1"}, {"   let parts=w.split(/\s+/).filter(Boolean);
  if(parts.length>1){
    let phrase=new RegExp(parts.map(p=>p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s+'),'i');
    if(phrase.test(ex))return ex.replace(phrase,'_____');
  }
  return null;
}
function startSentenceQuiz(){
  let pool=filtered().map(x=>({item:x,blank:sentenceBlank(x)})).filter(x=>x.blank);
  if(pool.length<4)return alert('No hay suficientes ejemplos que contengan literalmente la expresión en este grupo. Prueba otro File o sección.');
  sentenceQuiz={pool,qs:[...pool].sort(()=>Math.random()-.5).slice(0,Math.min(10,pool.length)),i:0,score:0};
  showSentenceQuiz();
}
function showSentenceQuiz(){
  if(sentenceQuiz.i>=sentenceQuiz.qs.length){
    touch();save();
    main.innerHTML=`<div class="screen"><div class="panel center"><div class="big">${sentenceQuiz.score}/${sentenceQuiz.qs.length}</div><h2>Frases completadas</h2><p>${sentenceQuiz.score>=Math.ceil(sentenceQuiz.qs.length*.8)?'Muy buen resultado.':'Repasa las expresiones que te han costado.'}</p><button class="primary" onclick="startSentenceQuiz()">✍️ Otras frases</button><button class="secondary" style="width:100%;margin-top:10px" onclick="quizHome()">Volver a practicar</button></div></div>`;
    return;
  }
  let q=sentenceQuiz.qs[sentenceQuiz.i], correct=q.item;
  let distractors=[...sentenceQuiz.pool].filter(x=>x.item.word!==correct.word).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.item);
  let opts=[correct,...distractors].sort(()=>Math.random()-.5);
  sentenceQuiz.currentOptions=opts;
  sentenceQuiz.currentCorrect=correct.word;
  main.innerHTML=`<div class="screen"><div class="matchscore"><span class="muted">✍️ Completa la frase</span><b>${sentenceQuiz.i+1}/${sentenceQuiz.qs.length}</b></div><div class="panel"><div class="sentencebox">${esc(q.blank)}</div><p class="muted center">Selecciona la expresión que completa el ejemplo original.</p><div class="sentenceopts">${opts.map((x,i)=>`<button type="button" class="sentencebtn" onclick="answerSentence(this,${i})">${esc(x.word)}</button>`).join('')}</div><div id="sentenceMsg" class="center muted" style="margin-top:12px"></div></div></div>`;
}
function answerSentence(btn,optIndex){
  let chosen=sentenceQuiz.currentOptions[optIndex].word;
  let correct=sentenceQuiz.currentCorrect;
  document.querySelectorAll('.sentencebtn').forEach(b=>b.disabled=true);
  let ok=chosen===correct;
  if(ok){sentenceQuiz.score++;btn.classList.add('matched');$('#sentenceMsg').textContent='✓ Correcto';}
  else{
    btn.classList.add('wrongflash');
    [...document.querySelectorAll('.sentencebtn')].find(b=>b.textContent===correct)?.classList.add('matched');
    $('#sentenceMsg').textContent='La respuesta era: '+correct;
  }
  sentenceQuiz.i++;
  setTimeout(showSentenceQuiz,900);
}

function startQuiz(){let pool=filtered();if(pool.length<4)return alert('Selecciona un grupo con al menos 4 términos.');quiz={pool,qs:[...pool].sort(()=>Math.random()-.5).slice(0,10),i:0,score:0,dir:$('#qdir').value};showQuiz()}
function showQuiz(){if(quiz.i>=quiz.qs.length){touch();save();main.innerHTML=`<div class="screen"><div class="panel center"><div class="big">${quiz.score}/10</div><h2>Resultado</h2><p>${quiz.score>=8?'Muy buen resultado.':quiz.score>=6?'Buen trabajo. Sigue repasando.':'Conviene repasar estas expresiones.'}</p><button class="primary" onclick="quizHome()">Nuevo test</button></div></div>`;return}let x=quiz.qs[quiz.i], dir=quiz.dir==='mix'?(Math.random()<.5?'en':'es'):quiz.dir, target=dir==='en'?'translation':'word', prompt=dir==='en'?x.word:x.translation;let wrong=quiz.pool.filter(y=>y.word!==x.word).sort(()=>Math.random()-.5).slice(0,3);let opts=[x,...wrong].sort(()=>Math.random()-.5);main.innerHTML=`<div class="screen"><div class="muted center">Pregunta ${quiz.i+1} / 10</div><div class="panel"><div class="word" style="font-size:24px;text-align:left">${esc(prompt)}</div>${dir==='en'?`<button class="secondary" onclick="speak('${encodeURIComponent(x.word)}')">🔊 Escuchar</button>`:''}<div style="margin-top:16px">${opts.map(o=>`<button class="quizopt" onclick="answer(this,${o===x})">${esc(o[target])}</button>`).join('')}</div><div id="qnext" class="hidden"><div class="example">${esc(x.example)}</div><button class="primary" style="width:100%;margin-top:10px" onclick="quiz.i++;showQuiz()">Siguiente →</button></div></div></div>`}
function answer(el,ok){document.querySelectorAll('.quizopt').forEach(b=>b.disabled=true);el.classList.add(ok?'correct':'wrong');if(ok)quiz.score++;$('#qnext').classList.remove('hidden')}
function listView(){main.innerHTML=`<div class="screen"><div class="panel"><h2>Vocabulario</h2><input id="search" placeholder="Buscar palabra, traducción o ejemplo…" oninput="renderList()">${filters()}</div><div class="panel" id="listbox"></div></div>`;$('#fFile').onchange=renderList;$('#fSec').onchange=renderList;renderList()}
function renderList(){let q=($('#search')?.value||'').toLowerCase(),a=filtered().filter(x=>(x.word+' '+x.translation+' '+x.example).toLowerCase().includes(q));$('#listbox').innerHTML=`<div class="muted">${a.length} resultados</div>`+a.slice(0,150).map(x=>`<div class="listitem"><b>${esc(x.word)}</b> <button onclick="speak('${encodeURIComponent(x.word)}')" style="padding:2px;background:white">🔊</button><div>${esc(x.translation)}</div><div class="muted">${esc(x.file)} · ${esc(x.section)}</div></div>`).join('')+(a.length>150?'<p class="muted">Mostrando los primeros 150 resultados.</p>':'')}
function progressView(){let r=state.ratings,c=[1,2,3,4].map(n=>Object.values(r).filter(x=>x===n).length),done=Object.keys(r).length,p=Math.round(done/DATA.length*100);main.innerHTML=`<div class="screen"><div class="panel center"><div class="big">${p}%</div><p>Has estudiado ${done} de ${DATA.length} términos.</p><div class="progressbar"><i style="width:${p}%"></i></div></div><div class="panel"><h3>Estado</h3><p>🔴 No la sé: <b>${c[0]}</b></p><p>🟠 Difícil: <b>${c[1]}</b></p><p>🟢 Bien: <b>${c[2]}</b></p><p>🔵 Fácil: <b>${c[3]}</b></p><button class="secondary" style="width:100%" onclick="if(confirm('¿Borrar todo el progreso?')){localStorage.removeItem(KEY);state={ratings:{},streak:0,last:''};save();progressView()}">Reiniciar progreso</button></div></div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))} updateStats();go('study');
